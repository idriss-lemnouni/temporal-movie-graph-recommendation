services:
  neo4j:
    image: neo4j:5.26.33-community
    environment:
      NEO4J_AUTH: neo4j/${MOVIELENS_NEO4J_PASSWORD:?Set the local Neo4j password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:57687:7687"]
    volumes: [graph:/data]
    healthcheck:
      test: ["CMD-SHELL", "NEO4J_PASSWORD=\"$${NEO4J_AUTH#*/}\" cypher-shell -u neo4j 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2.3-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  graph:
