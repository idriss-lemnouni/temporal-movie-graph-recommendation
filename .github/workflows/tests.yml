name: Tests

on: [push, pull_request]

jobs:
  temporal-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py --out runs/moviebench
      - name: Set up a temporary Neo4j password
        run: echo "MOVIELENS_NEO4J_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait
      - run: python graph.py --out runs/graph-verification.json
      - if: always()
        run: docker compose down
